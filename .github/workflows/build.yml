name: IoMBian builder

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install qemu-user-static
        run: sudo apt update && sudo apt install -y qemu-user-static
      - name: Patch pi-gen Dockerfile for archived bullseye repos
        run: |
          sed -i '/^FROM /a RUN sed -i "s|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g" /etc/apt/sources.list || true' pi-gen/Dockerfile
          head -8 pi-gen/Dockerfile
      - name: Build IoMBian
        run:
          ./build-iombian.sh
      - name: Rename zip file name
        run: mv deploy/*.zip iombian-${{ github.sha }}.zip 
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iombian-${{ github.sha }}.zip
          path: iombian-${{ github.sha }}.zip
          retention-days: 14