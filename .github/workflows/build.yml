name: IoMBian builder

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install qemu-user-static
        run: sudo apt update && sudo apt install -y qemu-user-static
      - name: Patch pi-gen Dockerfile for archived bullseye repos
        run: |
          sed -i -e '/^FROM /a RUN sed -i "s|deb.debian.org/debian-security|snapshot.debian.org/archive/debian-security/20260701T000000Z|g; s|security.debian.org/debian-security|snapshot.debian.org/archive/debian-security/20260701T000000Z|g; s|deb.debian.org/debian|snapshot.debian.org/archive/debian/20260701T000000Z|g" /etc/apt/sources.list' -e '/^FROM /a RUN echo "Acquire::Check-Valid-Until \\"false\\";" > /etc/apt/apt.conf.d/99no-valid-until' pi-gen/Dockerfile
          sed -i 's|apt-get -y update &&|apt-get -y update \&\& apt-get -y dist-upgrade \&\&|' pi-gen/Dockerfile
          head -8 pi-gen/Dockerfile
      - name: Build IoMBian
        run:
          ./build-iombian.sh
      - name: Rename zip file name
        run: mv deploy/*.zip iombian-${{ github.sha }}.zip 
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iombian-${{ github.sha }}.zip
          path: iombian-${{ github.sha }}.zip
          retention-days: 14