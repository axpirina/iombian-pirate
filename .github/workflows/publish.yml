name: IoMBian publisher

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install qemu-user-static
        run: sudo apt update && sudo apt install -y qemu-user-static
      - name: Patch pi-gen Dockerfile for archived bullseye repos
        run: |
          sed -i '/^FROM /a RUN sed -i "s|deb.debian.org/debian|snapshot.debian.org/archive/debian/20240901T000000Z|g; s|security.debian.org/debian-security|snapshot.debian.org/archive/debian-security/20240901T000000Z|g" /etc/apt/sources.list || true' pi-gen/Dockerfile
          head -8 pi-gen/Dockerfile
      - name: Build IoMBian
        run:
          ./build-iombian.sh
      - name: Rename file name with tag name
        run: mv deploy/*.zip iombian-${{ github.ref_name }}.zip
      - name: Publish the artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: iombian-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}